[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prodpilot"
version = "1.0.0rc2"
description = "A layered MCP-based system for automated production readiness and deployment of vibe-coded projects."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
keywords = ["mcp", "deployment", "production-readiness", "devops", "audit", "render", "ci-cd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Installation/Setup",
]
authors = [
    { name = "Muhammad Sudais Khalid", email = "msudaiskhalid.ai@gmail.com" },
    { name = "Muhammad Farooq Khan", email = "farooqhoi52@gmail.com" },
    { name = "Muhammad Talha Khan", email = "hotikhanbhai@gmail.com" },
]
dependencies = [
    "mcp>=2.0.0",
    "typer>=0.16.0",
    "tomli-w>=1.0.0",
    "docker>=7.0.0",
    "pynacl>=1.5.0",
    # Pinned to the version that saved the shipped model: scikit-learn only
    # guarantees a saved estimator loads under the version that saved it.
    "scikit-learn==1.9.0",
    "joblib>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/prodpilotai/ProdPilot"
Repository = "https://github.com/prodpilotai/ProdPilot"
Documentation = "https://github.com/prodpilotai/ProdPilot/blob/main/docs/quickstart.md"
Changelog = "https://github.com/prodpilotai/ProdPilot/blob/main/CHANGELOG.md"
Issues = "https://github.com/prodpilotai/ProdPilot/issues"

[project.scripts]
prodpilot = "prodpilot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prodpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
